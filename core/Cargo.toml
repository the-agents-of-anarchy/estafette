[package]
name = "estafette"
version.workspace = true
edition = "2024"

[lints]
workspace = true

[features]
relay = ["dep:iroh-relay", "dep:rustls"]
lab = []

[[test]]
name = "acceptance_lab"
required-features = ["lab"]

[dependencies]
iroh = "=1.3.0"
iroh-gossip = "=0.101.0"
n0-future = "=0.3.2"
iroh-relay = { version = "=1.3.0", optional = true, features = ["server"] }
rustls = { version = "=0.23.46", optional = true, default-features = false, features = ["ring", "std"] }
rmcp = { version = "=3.9.0", default-features = false, features = ["server", "transport-io"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
postcard = { version = "=1.1.3", default-features = false, features = ["alloc"] }
serde_json = "1"
estafette-trace = { path = "trace" }
blake3 = "1"
data-encoding = "2"
uuid = { version = "1", features = ["v7"] }
tokio = { version = "1", features = ["rt", "macros", "net", "time", "sync", "io-util", "signal"] }
toml = "*"
yaml-rust2 = "*"
libc = "0.2"
