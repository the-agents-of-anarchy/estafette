[package]
name = "e16-gossip-fix"
version = "0.0.0"
edition = "2024"
publish = false

# E16 DIAGNOSTIC: the E10/E12/E15 gossip harness source, unchanged, built against a vendored iroh-gossip 0.101.0 with
# one patch (`e16-iroh-gossip-0.101.0.patch`; run `sh vendor.sh` first). Stock iroh 1.3.0. Run with E16_FIX=1; unset = stock behavior. Ships nowhere.
[[bin]]
name = "e16-gossip-fix"
path = "../e10-gossip-main/src/main.rs"

[workspace]

[features]
a = ["dep:gossip-a"]

[dependencies]
iroh = "=1.3.0"
gossip-a = { package = "iroh-gossip", version = "=0.101.0", optional = true }
iroh-relay = { version = "=1.3.0", features = ["server"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time", "net", "signal", "process", "io-util", "sync"] }
bytes = "1"
n0-future = "*"
postcard = { version = "1", features = ["use-std"] }
serde = { version = "1", features = ["derive"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[patch.crates-io]
iroh-gossip = { path = "vendor/iroh-gossip-0.101.0" }
