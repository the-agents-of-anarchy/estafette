[package]
name = "proto"
version = "0.0.0"
edition = "2024"

[features]
irpc_path = ["dep:irpc", "dep:irpc-iroh", "dep:tracing"]

[dependencies]
iroh = "=1.3.0"
postcard = { version = "=1.1.3", features = ["use-std"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
anyhow = "1"
irpc = { version = "=0.17.0", default-features = false, features = ["rpc", "derive"], optional = true }
irpc-iroh = { version = "=0.17.0", optional = true }
tracing = { version = "0.1", optional = true }

[[bin]]
name = "hand"
path = "src/bin/hand.rs"

[[bin]]
name = "viairpc"
path = "src/bin/viairpc.rs"
required-features = ["irpc_path"]
