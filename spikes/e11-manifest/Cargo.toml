[package]
name = "e11-manifest"
version = "0.0.0"
edition = "2024"

# The draft manifest of staged-revisions.md, resolved and never built: only `cargo tree` runs here.
[dependencies]
iroh = "=1.3.0"
iroh-gossip = "=0.101.0"
rmcp = { version = "=3.5.1", default-features = false, features = ["server", "transport-io"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
postcard = { version = "=1.1.3", default-features = false, features = ["alloc"] }
serde_json = "1"
blake3 = "1"
data-encoding = "2"
uuid = { version = "1", features = ["v7"] }
tokio = { version = "1", features = ["rt", "macros", "net", "time", "sync", "io-util", "signal"] }
toml = "*"
yaml-rust2 = "*"
libc = "0.2"
iroh-relay = { version = "=1.3.0", features = ["server"], optional = true }

[features]
# The relay server, behind a feature in the draft.
relay = ["dep:iroh-relay"]
# rmcp with its default features (base64, macros, server) in place of `server` alone.
rmcp-defaults = ["rmcp/default"]
