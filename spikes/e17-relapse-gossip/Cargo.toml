[package]
name = "e17-relapse-gossip"
version = "0.0.0"
edition = "2024"
publish = false

# DIAGNOSTIC (E17): the E10/E12/E15 gossip harness source, built against vendored iroh 1.3.0 (E14 patch + E17 patch; run `sh vendor.sh` first). Ships nowhere.
[[bin]]
name = "e17-relapse-gossip"
path = "../e10-gossip-main/src/main.rs"

[workspace]

[features]
a = ["dep:gossip-a"]

[dependencies]
iroh = "=1.3.0"
gossip-a = { package = "iroh-gossip", version = "=0.101.0", optional = true }
iroh-relay = { version = "=1.3.0", features = ["server"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time", "net", "signal", "process", "io-util", "sync"] }
bytes = "1"
n0-future = "*"
postcard = { version = "1", features = ["use-std"] }
serde = { version = "1", features = ["derive"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[patch.crates-io]
iroh = { path = "vendor/iroh-1.3.0" }
