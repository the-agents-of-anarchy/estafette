[package]
name = "e24-cross"
version = "0.0.0"
edition = "2024"
publish = false

# E24: cross-machine member and host programs (the E21 member/host code without the loopback controller), built against stock iroh 1.3.0 and the vendored iroh-gossip 0.101.0 with the E18 patch (run `sh vendor.sh` first). Ships nowhere.
[workspace]

[dependencies]
iroh = "=1.3.0"
iroh-gossip = "=0.101.0"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time", "net", "signal", "io-util", "sync"] }
bytes = "1"
n0-future = "*"
postcard = { version = "1", features = ["use-std"] }
serde = { version = "1", features = ["derive"] }

[patch.crates-io]
iroh-gossip = { path = "vendor/iroh-gossip-0.101.0" }
