[package]
name = "e10-gossip-main"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[features]
# Exactly one of `a` (iroh-gossip =0.101.0, as E8) or `b` (iroh-gossip git main at the pinned rev).
a = ["dep:gossip-a"]
b = ["dep:gossip-b"]

[dependencies]
iroh = "=1.3.0"
gossip-a = { package = "iroh-gossip", version = "=0.101.0", optional = true }
gossip-b = { package = "iroh-gossip", git = "https://github.com/n0-computer/iroh-gossip", rev = "c5f44db74ccc232d4e81523117b7e95e36d4c5c5", optional = true }
iroh-relay = { version = "=1.3.0", features = ["server"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time", "net", "signal", "process", "io-util", "sync"] }
bytes = "1"
n0-future = "*"
postcard = { version = "1", features = ["use-std"] }
serde = { version = "1", features = ["derive"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
