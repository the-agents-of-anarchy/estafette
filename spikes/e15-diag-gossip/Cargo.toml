[package]
name = "e15-diag-gossip"
version = "0.0.0"
edition = "2024"
publish = false

# DIAGNOSTIC (A4): the E10/E12/E15 gossip harness source, unchanged, built against the vendored iroh 1.3.0 of
# ../e14-repro-patched (run `sh ../e14-repro-patched/vendor.sh` first). Run with E14_FIX=drain. Ships nowhere.
[[bin]]
name = "e15-diag-gossip"
path = "../e10-gossip-main/src/main.rs"

[workspace]

[features]
a = ["dep:gossip-a"]

[dependencies]
iroh = "=1.3.0"
gossip-a = { package = "iroh-gossip", version = "=0.101.0", optional = true }
iroh-relay = { version = "=1.3.0", features = ["server"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time", "net", "signal", "process", "io-util", "sync"] }
bytes = "1"
n0-future = "*"
postcard = { version = "1", features = ["use-std"] }
serde = { version = "1", features = ["derive"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[patch.crates-io]
iroh = { path = "../e14-repro-patched/vendor/iroh-1.3.0" }
