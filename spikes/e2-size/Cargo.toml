[package]
name = "e2-size"
version = "0.0.0"
edition = "2024"

[workspace]

[dependencies]
iroh = "=1.3.0"
iroh-gossip = "=0.101.0"
postcard = { version = "=1.1.3", default-features = false, features = ["alloc"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
n0-future = "*"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
bytes = "1"
