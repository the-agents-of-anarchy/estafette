[package]
name = "e11-mcp"
version = "0.0.0"
edition = "2024"

[dependencies]
rmcp = { version = "=3.5.1", default-features = false, features = ["server", "transport-io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "time", "signal"] }

# The probe uses rmcp's `#[tool]` macros to measure the library defaults; the server does not.
[features]
probe = ["rmcp/macros"]

[[bin]]
name = "probe"
required-features = ["probe"]
