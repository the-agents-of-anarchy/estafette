[package]
name = "e23-addr"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
iroh = "=1.3.0"
iroh-gossip = "=0.101.0"
iroh-relay = { version = "=1.3.0", features = ["server"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time", "net", "sync"] }
bytes = "1"
n0-future = "*"
n0-watcher = "*"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
