[package]
name = "e1-api"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
iroh = "=1.3.0"
iroh-gossip = "=0.101.0"
iroh-relay = { version = "=1.3.0", features = ["server"] }
iroh-mdns-address-lookup = "=0.6.0"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time", "net", "signal"] }
bytes = "1"
n0-future = "*"
