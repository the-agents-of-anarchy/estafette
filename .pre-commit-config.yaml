exclude: ^research/

default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]

repos:
    - repo: https://github.com/pre-commit/pre-commit-hooks
      rev: v6.0.0
      hooks:
          - id: trailing-whitespace
          - id: end-of-file-fixer
          - id: check-yaml
          - id: check-added-large-files
    - repo: local
      hooks:
          - id: check
            name: just check
            entry: just check
            language: system
            always_run: true
            pass_filenames: false
          - id: records
            name: just records
            entry: just records
            language: system
            stages: [pre-commit]
            always_run: true
            pass_filenames: false
          - id: commit-message
            name: just dev::check-message
            entry: just dev::check-message
            language: system
            stages: [commit-msg]
