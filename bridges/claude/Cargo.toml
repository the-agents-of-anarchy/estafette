[package]
name = "estafette-bridge-claude"
version.workspace = true
edition = "2024"

[lints]
workspace = true

[features]
lab = []

[[test]]
name = "acceptance_lab"
required-features = ["lab"]

[dependencies]
estafette-private-entry = { path = "../../core/private-entry" }
estafette-trace = { path = "../../core/trace" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
notify = { version = "=8.2.2", default-features = false, features = ["macos_kqueue"] }
