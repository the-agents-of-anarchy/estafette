[package]
name = "hol-repro"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
iroh = "=1.3.0"
iroh-relay = { version = "=1.3.0", features = ["server"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
