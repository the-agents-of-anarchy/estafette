name: instrumented-loop-of-the-two-linux-failures

on:
    push:
        branches:
            - ci/instrumented-loop-of-the-two-linux-failures
    workflow_dispatch:

permissions:
    contents: read

jobs:
    loop:
        name: instrumented-${{ matrix.shard }}
        runs-on: ubuntu-latest
        timeout-minutes: 200
        strategy:
            fail-fast: false
            matrix:
                include:
                    - { shard: 1, iterations: 8 }
                    - { shard: 2, iterations: 8 }
                    - { shard: 3, iterations: 8 }
                    - { shard: 4, iterations: 8 }
                    - { shard: 5, iterations: 8 }
                    - { shard: 6, iterations: 8 }
                    - { shard: 7, iterations: 8 }
                    - { shard: 8, iterations: 8 }
                    - { shard: 9, iterations: 8 }
                    - { shard: 10, iterations: 8 }
                    - { shard: 11, iterations: 8 }
                    - { shard: 12, iterations: 8 }
                    - { shard: 13, iterations: 8 }
                    - { shard: 14, iterations: 8 }
                    - { shard: 15, iterations: 8 }
                    - { shard: 16, iterations: 8 }
                    - { shard: 17, iterations: 8 }
                    - { shard: 18, iterations: 8 }
                    - { shard: 19, iterations: 8 }
                    - { shard: 20, iterations: 8 }
        env:
            ITERATIONS: ${{ matrix.iterations }}
            SHARD: ${{ matrix.shard }}
            WALL_BUDGET_MINUTES: 170
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - run: rustup toolchain install
            - run: sudo sysctl -w net.ipv4.ip_unprivileged_port_start=0
            - name: Build the test target once, with the features the gate uses
              run: cargo test --workspace --features estafette/relay --no-run
            - name: Loop
              id: loop
              shell: bash
              run: |
                  set +e
                  set -u
                  out="$RUNNER_TEMP/out"
                  instruments="$RUNNER_TEMP/instrument-b"
                  mkdir -p "$out/ports" "$instruments"
                  deadline=$((SECONDS + WALL_BUDGET_MINUTES * 60))
                  iterations_run=0
                  failed_iteration=0
                  for i in $(seq 1 "$ITERATIONS"); do
                      if [ "$SECONDS" -ge "$deadline" ]; then
                          echo "wall budget reached before iteration $i"
                          break
                      fi
                      kept="$RUNNER_TEMP/kept/$i"
                      mkdir -p "$kept"
                      log="$RUNNER_TEMP/iteration-$i.log"
                      INSTRUMENT_B_PORTS_FILE="$out/ports/iteration-$i.ports.txt" \
                      INSTRUMENT_B_IROH_LINES_FILE="$instruments/iteration-$i.iroh-lines.jsonl" \
                      ESTAFETTE_ACCEPTANCE_RUN_RECORDS="$kept" \
                      cargo test --workspace --features estafette/relay > "$log" 2>&1
                      code=$?
                      iterations_run=$i
                      echo "iteration $i exit $code"
                      if [ "$code" -ne 0 ]; then
                          failed_iteration=$i
                          break
                      fi
                  done
                  printf 'shard %s\niterations run %s\nfailed iteration %s\n' "$SHARD" "$iterations_run" "$failed_iteration" | tee "$out/iterations.txt"
                  if [ "$failed_iteration" -ne 0 ]; then
                      i=$failed_iteration
                      echo "FAILED ITERATION: $i"
                      cp "$RUNNER_TEMP/iteration-$i.log" "$out/full-output.log"
                      # The instruments' files of the failing iteration: the iroh lines of the test process (the ports file is already under out/ports for every iteration).
                      mkdir -p "$out/instruments"
                      if [ -f "$instruments/iteration-$i.iroh-lines.jsonl" ]; then
                          cp "$instruments/iteration-$i.iroh-lines.jsonl" "$out/instruments/"
                      else
                          echo "no iroh-lines file for iteration $i" > "$out/instruments/iroh-lines-missing.txt"
                      fi
                      kept="$RUNNER_TEMP/kept/$i"
                      # The failing tests' names as the harness printed them; a kept directory is the test's name with each colon a hyphen.
                      failing_names="$(sed -n 's/^test \(.*\) \.\.\. FAILED$/\1/p' "$RUNNER_TEMP/iteration-$i.log")"
                      echo "FAILED TESTS:"
                      printf '%s\n' "$failing_names"
                      printf '%s\n' "$failing_names" > "$out/failing-tests.txt"
                      while IFS= read -r name; do
                          [ -n "$name" ] || continue
                          dir="${name//:/-}"
                          [ -d "$kept/$dir" ] || { echo "no kept directory for $name" >> "$out/failing-tests.txt"; continue; }
                          # Trace files only: the events file, the raw file, their rolled-over .1, and the note a redaction leaves beside one.
                          (cd "$kept" && find "$dir" -type f -path '*/traces/*' \( -name '*.events.jsonl' -o -name '*.raw.jsonl' -o -name '*.events.jsonl.1' -o -name '*.raw.jsonl.1' -o -name '*.jsonl.redacted' -o -name '*.jsonl.1.redacted' \) -exec cp --parents {} "$out/" \;)
                      done <<< "$failing_names"
                      exit 1
                  fi
            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              if: always()
              with:
                  name: instrumented-${{ matrix.shard }}
                  path: ${{ runner.temp }}/out
                  if-no-files-found: warn
